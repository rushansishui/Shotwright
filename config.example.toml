# Shotwright 配置模板。复制为 config.toml 后按需填写。
# config.toml 已在 .gitignore 中，不会被提交。

[app]
# 项目与渲染结果的存放目录
storage_dir = "storage/projects"
# FFmpeg 不在 PATH 中时，填写完整路径，例如 "C:/ffmpeg/bin/ffmpeg.exe"
# ffmpeg = ""
# ffprobe = ""
# 访问外网需要代理时填写，例如 "http://127.0.0.1:7890"
# proxy = ""
# 渲染时为没有画面的镜头自动检索一次素材（AI 镜头需在渲染时勾选"收费生成"才会调用 AI）
auto_fetch_visuals = true
# 服务只接受发给本机地址（localhost / 127.0.0.1）的请求，防止被其他网页借道访问。
# 在局域网或 Docker 里给别的电脑用时，把服务器的 IP 或域名加到这里，例如 ["192.168.1.20"]
# allowed_hosts = []

# 各类别默认使用的 Provider
[defaults]
llm = "doubao"       # doubao / deepseek / kimi / qwen / openai
tts = "edge"        # 改成 "silent" 可离线预览
stock = "pixabay"     # 或 "pexels"（Pexels 目前暂停发放新 Key）
video_gen = "seedance"  # AI 视频（收费）
image_gen = "seedream"  # AI 图片（收费）；也可以用 "openai"

# ---- 大模型 ------------------------------------------------------------------
# 在 [defaults] 里把 llm 改成要用的那一家，然后在对应小节填写 api_key 即可。
# 模型更新很快，model 可以按控制台里的模型 ID 修改。

# 豆包 Seed：https://console.volcengine.com/ark（API Key 管理 + 开通模型）
[providers.llm.doubao]
api_key = ""
# model = "doubao-seed-2-1-pro-260915"

# DeepSeek：https://platform.deepseek.com
[providers.llm.deepseek]
api_key = ""
# model = "deepseek-flash"

# Kimi：https://platform.moonshot.cn
[providers.llm.kimi]
api_key = ""
# model = "kimi-k3"

# 通义千问：https://bailian.console.aliyun.com
[providers.llm.qwen]
api_key = ""
# model = "qwen-plus"

# 其他 OpenAI 兼容接口（OpenAI、本地 Ollama 等）
[providers.llm.openai]
api_key = ""
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"
# 本地 Ollama 示例（api_key 留空）：
# base_url = "http://127.0.0.1:11434/v1"
# model = "qwen2.5:7b"

# ---- 配音 --------------------------------------------------------------------
# 默认用 Edge 在线语音：免 Key、不收费。下面几家是收费服务，按需启用：
# 在 [defaults] 把 tts 改成对应的 id，再在对应小节填 api_key。
[providers.tts.edge]
timeout = "60"

# Azure 官方语音：https://portal.azure.com（语音服务 → 密钥和终结点）
[providers.tts.azure]
api_key = ""
# region = "eastasia"        # 必填，例如 eastasia、westus2

# 硅基流动：https://cloud.siliconflow.cn（API 密钥）
[providers.tts.siliconflow]
api_key = ""

# MiniMax：https://platform.minimaxi.com（接口密钥）
[providers.tts.minimax]
api_key = ""

# ElevenLabs：https://elevenlabs.io（Profile → API Keys）
[providers.tts.elevenlabs]
api_key = ""

# ---- 素材库 ------------------------------------------------------------------
# Pixabay：注册后在 https://pixabay.com/api/docs/ 页面即可看到自己的 Key（免费）
[providers.stock.pixabay]
api_key = ""

# Pexels：已有 Key 的可以继续使用（https://www.pexels.com/api/）
[providers.stock.pexels]
api_key = ""

# Coverr：免 Key，素材以横屏为主（https://coverr.co/developers）
[providers.stock.coverr]
# timeout = "30"

# ---- 背景音乐 ----------------------------------------------------------------
# Internet Archive：免 Key。音频授权不一（有的禁止商用或改编，有的没有标注），
# 发布前请确认授权；可以用 collection 限定在授权明确的合集。
[providers.music.archive]
# collection = ""             # 合集标识符；留空搜索全部公开音频。注意 opensource_audio 等社区合集的授权也不统一
# timeout = "30"
# allow_unknown_license = "true"
#   为 "false" 时只返回明确可商用的授权（CC0 / 公共领域 / CC BY / CC BY-SA）。
#   Archive 上很多条目没有标注授权，默认保留并在界面上标"未标注授权"，发布前请自行确认。

# ---- AI 画面（收费）----------------------------------------------------------
# Seedance / Seedream 与豆包大模型同属火山方舟：api_key 留空时自动使用
# [providers.llm.doubao] 的 Key。需要先在方舟控制台"开通管理"里开通对应模型。
# 每次生成都会在界面上弹窗确认；渲染时不勾选"收费生成"就改用素材检索。

# AI 视频：https://www.volcengine.com/docs/82379/1520757
[providers.video_gen.seedance]
# api_key = ""
# model = "doubao-seedance-2-5-260628"
# resolution = "1080p"        # 480p / 720p / 1080p，越高越贵
# min_duration = "4"          # 模型支持的时长范围（秒），镜头时长会向上取整后限制在这个范围内
# max_duration = "30"
# generate_audio = "false"    # 是否生成音效（口播视频一般不需要）

# AI 图片：https://www.volcengine.com/docs/82379/1541523
[providers.image_gen.seedream]
# api_key = ""
# model = "doubao-seedream-5-0-pro-260628"   # 或更便宜的 doubao-seedream-5-0-flash-260915
# size = ""                   # 留空按画布比例自动选择

# 其他兼容 OpenAI Images 接口的文生图服务
[providers.image_gen.openai]
api_key = ""
base_url = "https://api.openai.com/v1"
model = ""
