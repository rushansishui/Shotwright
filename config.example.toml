# Shotwright 配置模板。复制为 config.toml 后按需填写。
# config.toml 已在 .gitignore 中，不会被提交。

[app]
# 项目与渲染结果的存放目录
storage_dir = "storage/projects"
# FFmpeg 不在 PATH 中时，填写完整路径，例如 "C:/ffmpeg/bin/ffmpeg.exe"
# ffmpeg = ""
# ffprobe = ""
# 访问外网需要代理时填写，例如 "http://127.0.0.1:7890"
# proxy = ""
# 渲染时为没有画面的镜头自动检索一次素材
auto_fetch_visuals = true

# 各类别默认使用的 Provider
[defaults]
llm = "doubao"       # doubao / deepseek / kimi / qwen / openai
tts = "edge"        # 改成 "silent" 可离线预览
stock = "pixabay"     # 或 "pexels"（Pexels 目前暂停发放新 Key）

# ---- 大模型 ------------------------------------------------------------------
# 在 [defaults] 里把 llm 改成要用的那一家，然后在对应小节填写 api_key 即可。
# 模型更新很快，model 可以按控制台里的模型 ID 修改。

# 豆包 Seed：https://console.volcengine.com/ark（API Key 管理 + 开通模型）
[providers.llm.doubao]
api_key = ""
# model = "doubao-seed-2-0-pro-260215"

# DeepSeek：https://platform.deepseek.com
[providers.llm.deepseek]
api_key = ""
# model = "deepseek-flash"

# Kimi：https://platform.moonshot.cn
[providers.llm.kimi]
api_key = ""
# model = "kimi-k3"

# 通义千问：https://bailian.console.aliyun.com
[providers.llm.qwen]
api_key = ""
# model = "qwen-plus"

# 其他 OpenAI 兼容接口（OpenAI、本地 Ollama 等）
[providers.llm.openai]
api_key = ""
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"
# 本地 Ollama 示例（api_key 留空）：
# base_url = "http://127.0.0.1:11434/v1"
# model = "qwen2.5:7b"

# ---- 配音 --------------------------------------------------------------------
[providers.tts.edge]
timeout = "60"

# ---- 素材库 ------------------------------------------------------------------
# Pixabay：注册后在 https://pixabay.com/api/docs/ 页面即可看到自己的 Key（免费）
[providers.stock.pixabay]
api_key = ""

# Pexels：已有 Key 的可以继续使用（https://www.pexels.com/api/）
[providers.stock.pexels]
api_key = ""
