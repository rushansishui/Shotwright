# fal.ai 聚合平台：填模型路径就能用 Veo、Kling、Vidu、Luma 等（国内需要 proxy）
# 模型路径在 https://fal.ai/explore/text-to-video-apis 的模型页上
[providers.video_gen.fal]
# api_key = ""
queue_url = "https://queue.fal.run"   # fal 的队列接口地址
# model = "fal-ai/veo3/fast"
# image_model = ""            # 有首帧时改用的图生视频模型路径（可选）
# duration_format = "string"  # 时长写法：int（5）/ string（"5"）/ seconds（"5s"）/ none（不传）
# durations = "4,6,8"         # 模型支持的时长档位
# extra = '{"generate_audio": false}'   # 其他参数，原样合并进请求
# aspect_field = "aspect_ratio"  # 画面比例参数名；模型没有这个参数时填 none
# 例：用 fal 上的可灵 3.0（模型页：fal.ai/models/fal-ai/kling-video/v3/pro/image-to-video）
#   model = "fal-ai/kling-video/v3/pro/text-to-video"
#   image_model = "fal-ai/kling-video/v3/pro/image-to-video"
#   image_field = "start_image_url"
#   duration_format = "string"
#   min_duration = "3"
#   max_duration = "15"
#   extra = '{"generate_audio": false}'   # 可灵默认生成声音（更贵），镜匠自己配音
