# reference_model = ""        # 留空时第一张参考图作为首帧；填 kling-v1-6 时用多图参考（最多 4 张）
# price = ""                  # 可灵按积分计费，请填实际单价

# MiniMax 海螺：https://platform.minimaxi.com ，api_key 留空时使用 MiniMax 配音的 Key
[providers.video_gen.minimax]
# api_key = ""
# model = "MiniMax-Hailuo-2.3"   # 6 / 10 秒；MiniMax-H3 支持参考图（最多 9 张）、4～15 秒（另有 -Highspeed / -Lite / -Max）
base_url = "https://api.minimaxi.com"   # 国际：https://api.minimax.io
# resolution = "768p"         # Hailuo：512p / 768p / 1080p（1080p 只有 6 秒）；H3：768p / 2k
# price = ""

