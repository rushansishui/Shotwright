[project]
name = "shotwright"
version = "0.4.0"
description = "Shotwright 镜匠：以分镜为核心的短视频生成工具，AI 生成画面与素材混剪"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "edge-tts>=7.0",
    "pillow>=10.0",
    "fonttools>=4.40",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
shotwright = "shotwright.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shotwright"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["gate: 测试「素材确认后才能生成 AI 画面」的拦截本身（其他测试默认跳过拦截）"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]  # B008：FastAPI 的 File(...) 依赖写法

[tool.ruff.format]
exclude = ["*.md"]
