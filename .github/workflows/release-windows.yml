name: Windows installer

# 在 GitHub 的 Windows 机器上打包并验证安装包：
#   代码检查和单元测试 → 冻结 → 冒烟测试（doctor + 启动服务 + 渲染一条成片）→ 生成安装程序
#   → 静默安装 → 对装好的程序再跑一遍冒烟测试 → 静默卸载，确认用户数据还在。
# 触发：手动运行（Actions 页面 Run workflow）、推送 v* 标签、合并到 main 且改动了会影响安装包的文件、
# 每周一凌晨定时跑一次。只有推标签时才把安装包附到 Release 上，其余只验证、不发布：
# 以前打包流程只在发版时跑，Python 版本、参数传递、中文编码这类问题要到发版当天才暴露。

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "shotwright/**"
      - "scripts/**"
      - "web/**"
      - "resources/**"
      - "pyproject.toml"
      - ".github/workflows/release-windows.yml"
  schedule:
    # 每周一 02:30（北京时间）= 周日 18:30 UTC：依赖和 GitHub 机器环境会悄悄变化，定期跑一次。
    - cron: "30 18 * * 0"

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 和 CI 的后端检查一样：代码检查和单元测试不过，就不打包、不发布。
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest

  installer:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Check version numbers
        # 版本号在 pyproject.toml 和 web/package.json 各有一份，要一致；
        # 推标签发版时，标签（去掉开头的 v）也要和它一致，否则安装包会带着错的版本号发出去。
        run: |
          $py = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          $web = (Get-Content web\package.json -Raw | ConvertFrom-Json).version
          Write-Host "pyproject.toml: $py  web/package.json: $web"
          if ($py -ne $web) { throw "版本号不一致：pyproject.toml 是 $py，web/package.json 是 $web" }
          if ('${{ github.ref_type }}' -eq 'tag') {
            $tag = '${{ github.ref_name }}' -replace '^v', ''
            if ($tag -ne $py) { throw "标签 ${{ github.ref_name }} 和 pyproject.toml 里的版本号 $py 不一致" }
          }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Inno Setup
        # 固定版本，不依赖机器上预装的版本：安装界面的简体中文需要 6.5 以上。
        # 升级时同时改版本号和校验值（官方下载页：https://jrsoftware.org/isdl.php）。
        run: |
          $version = '6.7.4'
          $sha256 = 'a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c'
          $tag = 'is-' + $version.Replace('.', '_')
          $exe = Join-Path $env:RUNNER_TEMP "innosetup-$version.exe"
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/$tag/innosetup-$version.exe" -OutFile $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $sha256) { throw "Inno Setup 安装程序校验失败：$hash" }
          $dir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          Start-Process $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/CURRENTUSER',"/DIR=$dir" -Wait
          $iscc = Join-Path $dir 'ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup 安装失败，找不到 $iscc" }
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build, smoke test and package
        run: ./scripts/build-installer.ps1 -IsccPath $env:ISCC_PATH

      - name: Install silently and test the installed program
        run: |
          $setup = Get-ChildItem dist\installer\Shotwright-*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/LOG=install.log' -Wait
          $exe = "$env:LOCALAPPDATA\Programs\Shotwright\Shotwright.exe"
          if (-not (Test-Path $exe)) { Get-Content install.log -Tail 40; throw "安装后找不到 $exe" }
          python scripts\smoke_test.py $exe
          if ($LASTEXITCODE -ne 0) { throw '已安装程序的冒烟测试失败' }

      - name: Uninstall silently and keep user data
        run: |
          # 第一次启动（不设 SHOTWRIGHT_HOME）应在 %LOCALAPPDATA%\Shotwright 建好配置。
          $exe = "$env:LOCALAPPDATA\Programs\Shotwright\Shotwright.exe"
          & $exe doctor
          $config = "$env:LOCALAPPDATA\Shotwright\config.toml"
          if (-not (Test-Path $config)) { throw "没有创建 $config" }
          Start-Process "$env:LOCALAPPDATA\Programs\Shotwright\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { throw '卸载后程序还在' }
          if (-not (Test-Path $config)) { throw '卸载时把用户配置删掉了' }

      - uses: actions/upload-artifact@v4
        with:
          name: Shotwright-windows-installer
          path: dist/installer/*.exe
          if-no-files-found: error
          # 日常验证出的安装包只留一周，免得占满仓库的存储额度；发版的安装包在 Release 里。
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 30 || 7 }}

      - name: Add fixed-name copy and checksum
        # README 里的「下载最新版」直链指向 releases/latest/download/Shotwright-setup.exe，
        # 所以每个 Release 除了带版本号的安装包，再附一份固定名字的副本。
        # 国内用户常走第三方加速地址下载，附上 SHA256 方便核对文件没被改过。
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $setup = Get-ChildItem dist\installer\Shotwright-*-setup.exe | Select-Object -First 1
          Copy-Item $setup.FullName dist\installer\Shotwright-setup.exe -Force
          $hash = (Get-FileHash dist\installer\Shotwright-setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Shotwright-setup.exe" | Out-File dist\installer\Shotwright-setup.exe.sha256 -Encoding ascii
          "SETUP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_MB=$([math]::Round($setup.Length / 1MB))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload to China mirror (optional)
        # 国内下载镜像：把安装包传到兼容 S3 的对象存储（腾讯云 COS、阿里云 OSS 等）。
        # 在仓库 Settings → Secrets and variables → Actions 里配好下面这些才会上传，没配就跳过：
        #   Secrets：MIRROR_S3_ACCESS_KEY、MIRROR_S3_SECRET_KEY
        #   Variables：MIRROR_S3_ENDPOINT（如 https://cos.ap-shanghai.myqcloud.com）、MIRROR_S3_REGION（如 ap-shanghai）、
        #              MIRROR_S3_BUCKET（存储桶名）、MIRROR_PUBLIC_URL（对外的下载地址前缀，如 https://dl.example.com）
        # 上传到 <桶>/shotwright/latest/ 和 <桶>/shotwright/<版本>/ 两处，README 里的国内直链指向 latest。
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MIRROR_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MIRROR_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.MIRROR_S3_REGION }}
          MIRROR_S3_ENDPOINT: ${{ vars.MIRROR_S3_ENDPOINT }}
          MIRROR_S3_BUCKET: ${{ vars.MIRROR_S3_BUCKET }}
          MIRROR_PUBLIC_URL: ${{ vars.MIRROR_PUBLIC_URL }}
          # 新版 AWS CLI 默认附加的完整性校验头，COS / OSS 的 S3 兼容接口不认，只在必需时才加。
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          if (-not $env:AWS_ACCESS_KEY_ID -or -not $env:MIRROR_S3_BUCKET -or -not $env:MIRROR_S3_ENDPOINT) {
            Write-Host '没有配置国内镜像（MIRROR_S3_*），跳过上传'
            exit 0
          }
          aws configure set default.s3.addressing_style virtual
          $version = '${{ github.ref_name }}'
          foreach ($prefix in @("shotwright/$version", 'shotwright/latest')) {
            foreach ($name in @('Shotwright-setup.exe', 'Shotwright-setup.exe.sha256')) {
              aws s3 cp "dist\installer\$name" "s3://$env:MIRROR_S3_BUCKET/$prefix/$name" --endpoint-url $env:MIRROR_S3_ENDPOINT --no-progress
              if ($LASTEXITCODE -ne 0) { throw "上传 $prefix/$name 失败" }
            }
          }
          if ($env:MIRROR_PUBLIC_URL) {
            "MIRROR_URL=$($env:MIRROR_PUBLIC_URL.TrimEnd('/'))/shotwright/$version/Shotwright-setup.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $repo = '${{ github.repository }}'
          $direct = "https://github.com/$repo/releases/download/${{ github.ref_name }}/Shotwright-setup.exe"
          $lines = @(
            '## 下载安装 / Download',
            '',
            'Windows 10 / 11（64 位）：下载下面的 **Shotwright-setup.exe**，双击安装。不需要管理员权限，也不用另装 Python、Node.js 和 FFmpeg。',
            'Windows 10 / 11 (64-bit): download **Shotwright-setup.exe** below and run it. No admin rights, no separate Python, Node.js or FFmpeg install.',
            '',
            "### 国内下载（约 $env:SETUP_MB MB）",
            ''
          )
          if ($env:MIRROR_URL) { $lines += "- 国内镜像（推荐）：$env:MIRROR_URL" }
          $lines += @(
            "- 加速地址 1：https://gh-proxy.com/$direct",
            "- 加速地址 2：https://ghfast.top/$direct",
            '',
            '加速地址是第三方公益服务，偶尔会慢或打不开，换一个即可。下载后可以核对 SHA256（PowerShell：`Get-FileHash .\Shotwright-setup.exe`）：',
            '',
            "``$env:SETUP_SHA256``",
            '',
            '如果 Windows 提示「Windows 已保护你的电脑」，点「更多信息」→「仍要运行」（安装包暂未做代码签名）。',
            'If Windows shows "Windows protected your PC", click "More info" → "Run anyway" (the installer is not code-signed yet).',
            '',
            '`Shotwright-<版本>-setup.exe` 与 `Shotwright-setup.exe` 是同一个文件 / are the same file.'
          )
          $lines -join "`n" | Out-File dist\release-notes.md -Encoding utf8

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/*.exe
            dist/installer/*.sha256
          generate_release_notes: true
          body_path: dist/release-notes.md
